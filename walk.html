<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>캠퍼스 걷기</title>
<meta name="description" content="OpenStreetMap 건물 자료로 지은 3D 캠퍼스를 캐릭터로 걸어 다니며 둘러봅니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<style>
/* Layout: full-screen 3D campus; thin top bar, minimap top-right, joystick bottom-left, place list as a side sheet. */
:root{
  --panel:rgba(248,250,246,.92); --panel-solid:#F7F9F5; --ink:#1B252E; --muted:#5B686D; --line:rgba(27,37,46,.14);
  --accent:#1E6B62; --accent-ink:#FFFFFF; --sky:#cfe2ec;
  --shadow:0 1px 2px rgba(20,30,35,.08),0 6px 20px rgba(20,30,35,.12);
  --f-display:"Nanum Myeongjo","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --panel:rgba(21,28,32,.9); --panel-solid:#151C20; --ink:#E5ECE9; --muted:#93A19E; --line:rgba(229,236,233,.16);
  --accent:#55B6A8; --accent-ink:#0B1513; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent}
button,a{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;
  padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));pointer-events:none}
.top > *{pointer-events:auto}
.btn{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:10px;padding:7px 11px;font-size:.84rem;cursor:pointer;text-decoration:none;box-shadow:var(--shadow);white-space:nowrap}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.title{flex:1;min-width:0;background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:10px;padding:5px 12px;box-shadow:var(--shadow)}
.title b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.02rem;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title span{display:block;font-size:.72rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mini{position:fixed;z-index:4;right:max(10px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));width:150px;height:150px;border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--panel-solid);cursor:crosshair}
.joy{position:fixed;z-index:5;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.7);box-shadow:var(--shadow);touch-action:none}
.joy .knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none}
.side{position:fixed;z-index:5;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.near{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(48px + env(safe-area-inset-bottom,0px));background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:.86rem;box-shadow:var(--shadow);white-space:nowrap;max-width:calc(100% - 340px);overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.near b{font-weight:600}
.hint{position:fixed;z-index:5;left:50%;transform:translateX(-50%);top:calc(66px + env(safe-area-inset-top,0px));background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 13px;font-size:.78rem;box-shadow:var(--shadow);white-space:nowrap;transition:opacity .6s}
.hint.fade{opacity:0}
.note{position:fixed;z-index:5;left:max(10px,env(safe-area-inset-left,0px));top:calc(66px + env(safe-area-inset-top,0px));max-width:min(320px,calc(100% - 190px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:.76rem;line-height:1.5;color:var(--muted);box-shadow:var(--shadow)}
.note a{color:var(--accent)}
.places{position:fixed;z-index:6;top:0;bottom:0;right:0;width:min(320px,88vw);background:var(--panel-solid);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.places header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.places header b{flex:1;font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.places ul{list-style:none;margin:0;padding:6px;overflow-y:auto;flex:1}
.places li button{width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:9px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.places li button:hover{background:rgba(30,107,98,.1)}
.places li button span{color:var(--muted);font-size:.76rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.places .empty{padding:14px;color:var(--muted);font-size:.85rem;line-height:1.6}
.attr{position:fixed;z-index:4;right:max(8px,env(safe-area-inset-right,0px));bottom:calc(6px + env(safe-area-inset-bottom,0px));font-size:.68rem;color:#2b3640;background:rgba(255,255,255,.75);border-radius:6px;padding:2px 7px}
.attr a{color:inherit}
.load{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:var(--sky);padding:16px}
.load .box{background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);max-width:400px;display:grid;gap:10px;text-align:center}
.load h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.load p{margin:0;color:var(--muted);font-size:.88rem;line-height:1.6}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:30%;background:var(--accent);border-radius:99px;animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
.fader{position:fixed;inset:0;z-index:9;background:var(--sky);opacity:0;pointer-events:none;transition:opacity .25s}
.fader.on{opacity:1}
@media (max-width:640px){
  #mini{width:112px;height:112px}
  .near{max-width:calc(100% - 40px);bottom:calc(182px + env(safe-area-inset-bottom,0px))}
  .hint{white-space:normal;text-align:center;width:calc(100% - 24px);border-radius:12px}
  .note{max-width:calc(100% - 140px)}
}
@media (hover:hover) and (pointer:fine){.joy{opacity:.55}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}.fader{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="3D 캠퍼스"></canvas>
<div class="top">
  <a class="btn" href="./" id="back">← 지도</a>
  <div class="title"><b id="name">캠퍼스</b><span id="sub">건물 정보를 받는 중</span></div>
  <button class="btn" id="placesBtn">가 볼 곳</button>
</div>
<canvas id="mini" aria-label="미니맵: 누르면 그 자리로 이동"></canvas>
<div class="hint" id="hint">WASD·방향키로 걷기 · 화면을 끌어 둘러보기 · Shift 달리기</div>
<div class="note" id="note" hidden></div>
<div class="near" id="near" hidden></div>
<div class="joy" id="joy" aria-label="이동 조이스틱"><div class="knob" id="knob"></div></div>
<div class="side">
  <button class="btn" id="runBtn" aria-pressed="false">달리기</button>
  <button class="btn" id="viewBtn" aria-pressed="false">높이 보기</button>
</div>
<aside class="places" id="places" hidden>
  <header><b>가 볼 곳</b><button class="btn" id="placesClose">닫기</button></header>
  <ul id="placeList"></ul>
</aside>
<div class="attr">건물·길 <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap 기여자</a></div>
<div class="fader" id="fader"></div>
<div class="load" id="load">
  <div class="box">
    <h1 id="loadTitle">캠퍼스로 가는 중</h1>
    <p id="loadMsg">OpenStreetMap에서 건물과 길 정보를 받는 중입니다.</p>
    <div class="bar" id="loadBar"><i></i></div>
    <div id="loadActions" hidden style="display:flex;gap:8px;justify-content:center">
      <button class="btn on" id="retry">다시 시도</button><a class="btn" href="./">지도로 돌아가기</a>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const P=new URLSearchParams(location.search);
const LAT=parseFloat(P.get('lat')), LON=parseFloat(P.get('lon'));
const NAME=(P.get('name')||'캠퍼스').slice(0,60);
const MOCK=P.has('mock');
const R=700; // metres around the school point
$('name').textContent=NAME; document.title=NAME+' 걷기';
$('loadTitle').textContent=NAME+'(으)로 가는 중';
const isTouch=matchMedia('(pointer:coarse)').matches;
if(isTouch) $('hint').textContent='왼쪽 아래 동그라미로 걷기 · 화면을 끌어 둘러보기 · 두 손가락으로 확대';

function status(t){$('loadMsg').textContent=t;}
function fail(t){status(t);$('loadBar').hidden=true;$('loadActions').hidden=false;}
$('retry').onclick=()=>location.reload();
if(typeof THREE==='undefined'){fail('3D 엔진을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');return;}
if(!isFinite(LAT)||!isFinite(LON)){fail('학교 위치 정보가 없습니다. 지도에서 학교를 고른 뒤 “걸어서 들어가기”를 눌러 주세요.');return;}

/* ---------- projection: local metres, x east, z south ---------- */
const KX=Math.cos(LAT*Math.PI/180)*111320, KZ=110540;
const px=lon=>(lon-LON)*KX, pz=lat=>-(lat-LAT)*KZ;

/* ---------- OpenStreetMap via Overpass (fetched in the visitor's browser) ---------- */
const Q=`[out:json][timeout:40];(`+
 `way["building"](around:${R},${LAT},${LON});`+
 `way["highway"](around:${R},${LAT},${LON});`+
 `way["leisure"~"^(pitch|park|garden|track|stadium)$"](around:${R},${LAT},${LON});`+
 `way["landuse"~"^(grass|forest|recreation_ground|meadow|village_green)$"](around:${R},${LAT},${LON});`+
 `way["natural"~"^(water|wood)$"](around:${R},${LAT},${LON});`+
 `way["amenity"~"^(university|college)$"](around:${R},${LAT},${LON});`+
 `relation["amenity"~"^(university|college)$"](around:${R},${LAT},${LON});`+
 `);out geom;`;
const EPS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
async function getOSM(){
  if(MOCK){const r=await fetch('mock-osm.json');return r.json();}
  const key='osm2:'+LAT.toFixed(4)+','+LON.toFixed(4);
  try{const c=sessionStorage.getItem(key);if(c)return JSON.parse(c);}catch(e){}
  let err;
  for(let i=0;i<EPS.length;i++){
    try{
      const ac=new AbortController();const t=setTimeout(()=>ac.abort(),45000);
      const r=await fetch(EPS[i],{method:'POST',body:'data='+encodeURIComponent(Q),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ac.signal});
      clearTimeout(t);
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json();
      try{sessionStorage.setItem(key,JSON.stringify(j));}catch(e){}
      return j;
    }catch(e){err=e;status('지도 서버가 바빠서 다른 서버에서 다시 받는 중입니다…');}
  }
  throw err||new Error('fetch failed');
}

/* ---------- geometry helpers ---------- */
function ring(geom){const p=geom.map(g=>[px(g.lon),pz(g.lat)]);if(p.length>2){const a=p[0],b=p[p.length-1];if(Math.abs(a[0]-b[0])<.01&&Math.abs(a[1]-b[1])<.01)p.pop();}return p;}
function line(geom){return geom.map(g=>[px(g.lon),pz(g.lat)]);}
function pip(x,z,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],zi=poly[i][1],xj=poly[j][0],zj=poly[j][1];if(((zi>z)!==(zj>z))&&(x<(xj-xi)*(z-zi)/(zj-zi)+xi))c=!c;}return c;}
function centroid(p){let x=0,z=0;for(const q of p){x+=q[0];z+=q[1];}return [x/p.length,z/p.length];}
function area(p){let a=0;for(let i=0,j=p.length-1;i<p.length;j=i++)a+=(p[j][0]+p[i][0])*(p[j][1]-p[i][1]);return Math.abs(a/2);}
function bbox(p){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const q of p){if(q[0]<a)a=q[0];if(q[1]<b)b=q[1];if(q[0]>c)c=q[0];if(q[1]>d)d=q[1];}return {minx:a,minz:b,maxx:c,maxz:d};}
function hull(pts){if(pts.length<4)return pts.slice();const s=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];for(const p of s){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}for(let i=s.length-1;i>=0;i--){const p=s[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}up.pop();lo.pop();return lo.concat(up);}
function hash(n){n=(n^61)^(n>>>16);n=n+(n<<3);n=n^(n>>>4);n=Math.imul(n,0x27d4eb2d);n=n^(n>>>15);return (n>>>0)/4294967296;}
function rng(seed){let s=seed>>>0||1;return()=>(s=(Math.imul(s,1664525)+1013904223)>>>0)/4294967296;}

/* ---------- parse ---------- */
function parse(j){
  const D={campus:[],buildings:[],roads:[],areas:[]};
  for(const e of (j.elements||[])){
    const t=e.tags||{};
    if(e.type==='relation'&&/^(university|college)$/.test(t.amenity||'')){
      const pts=[];for(const m of (e.members||[]))if(m.geometry&&m.role!=='inner')for(const g of m.geometry)pts.push([px(g.lon),pz(g.lat)]);
      if(pts.length>2)D.campus.push({pts:hull(pts),name:t.name||''});
      continue;
    }
    if(e.type!=='way'||!e.geometry||e.geometry.length<2)continue;
    if(/^(university|college)$/.test(t.amenity||'')&&!t.building){const p=ring(e.geometry);if(p.length>2)D.campus.push({pts:p,name:t.name||''});continue;}
    if(t.building){
      if(t.location==='underground'||parseFloat(t.layer)<0||t.building==='construction')continue;
      const p=ring(e.geometry);if(p.length<3)continue;
      D.buildings.push({id:e.id,t,pts:p});continue;
    }
    if(t.highway){if(/^(construction|proposed|elevator|platform)$/.test(t.highway))continue;D.roads.push({t,pts:line(e.geometry)});continue;}
    const kind=t.natural==='water'?'water':(t.natural==='wood'||t.landuse==='forest')?'wood':t.leisure==='pitch'?'pitch':t.leisure==='track'?'track':(t.leisure==='park'||t.leisure==='garden')?'park':t.leisure==='stadium'?'stadium':'grass';
    const p=ring(e.geometry);if(p.length>2)D.areas.push({kind,pts:p});
  }
  return D;
}

/* ---------- three.js scene ---------- */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const SKY=new THREE.Color('#cfe2ec');
scene.background=SKY;scene.fog=new THREE.Fog(SKY,180,620);
const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.3,2000);
scene.add(new THREE.HemisphereLight('#f2f6fb','#9aa58a',.66));
const sun=new THREE.DirectionalLight('#fff0d8',.46);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-75,right:75,top:75,bottom:-75,near:1,far:400});
sun.shadow.bias=-0.0006;
scene.add(sun,sun.target);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();drawMiniStatic();});

const B=[]; // buildings with collision data
let CAMPUS=[], campusCenter=[0,0];
const GRID=16, grid=new Map();
function gridAdd(i,b){for(let gx=Math.floor(b.minx/GRID);gx<=Math.floor(b.maxx/GRID);gx++)for(let gz=Math.floor(b.minz/GRID);gz<=Math.floor(b.maxz/GRID);gz++){const k=gx+','+gz;let l=grid.get(k);if(!l)grid.set(k,l=[]);l.push(i);}}
function inBuilding(x,z){const l=grid.get(Math.floor(x/GRID)+','+Math.floor(z/GRID));if(!l)return -1;for(const i of l){const b=B[i];if(x<b.minx||x>b.maxx||z<b.minz||z>b.maxz)continue;if(pip(x,z,b.pts))return i;}return -1;}
const PR=0.42;
function blocked(x,z){if(x*x+z*z>(R*0.97)**2)return true;return inBuilding(x,z)>=0||inBuilding(x+PR,z)>=0||inBuilding(x-PR,z)>=0||inBuilding(x,z+PR)>=0||inBuilding(x,z-PR)>=0;}
function freeNear(x,z){if(!blocked(x,z))return [x,z];for(let r=1.5;r<260;r+=1.5){const n=Math.max(12,Math.round(r));for(let a=0;a<n;a++){const t=a/n*Math.PI*2,X=x+Math.cos(t)*r,Z=z+Math.sin(t)*r;if(!blocked(X,Z))return [X,Z];}}return [x,z];}
function isCampus(x,z){if(!CAMPUS.length)return x*x+z*z<300*300;for(const c of CAMPUS)if(pip(x,z,c.pts))return true;return false;}

function windowTexture(){
  const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  g.fillStyle='#ffffff';g.fillRect(0,0,64,64);
  g.fillStyle='#7c8f9c';g.fillRect(12,18,40,28);
  g.fillStyle='#a9bcc8';g.fillRect(12,18,40,7);
  g.fillStyle='#ffffff';g.fillRect(31,18,2,28);
  g.fillStyle='#e6e1d8';g.fillRect(0,59,64,5);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1/4,1/3.5);t.anisotropy=4;return t;
}
const CAMPUS_WALLS=['#f1e8d8','#ece2d2','#f5f1ea','#e3d6c4','#efe9df','#e8dccc','#f0ebe3'].map(c=>new THREE.Color(c));
const CAMPUS_ROOFS=['#8fb09a','#c8b9a4','#9db7a6','#bfae98','#a7b8ae'].map(c=>new THREE.Color(c)); // green waterproof roofs are common on Korean flat roofs
const TOWN_WALLS=['#d9dcdb','#d2d6d7','#dcd9d3','#cfd3d2'].map(c=>new THREE.Color(c));
const TOWN_ROOFS=['#b6bcbf','#bfc3c2','#aeb6b8'].map(c=>new THREE.Color(c));

function heightOf(t,campus,a){
  if(t.height){const h=parseFloat(t.height);if(isFinite(h)&&h>2&&h<320)return h;}
  if(t['building:levels']){const l=parseFloat(t['building:levels']);if(isFinite(l)&&l>0&&l<90)return l*3.5+0.8;}
  const b=t.building;
  if(/^(house|detached|hut|shed|garage|garages|kiosk|toilets|cabin|roof|carport)$/.test(b))return 4.2;
  if(b==='apartments')return 38;
  if(campus)return a>2500?18.3:a>900?14.8:a>250?11.3:7.8;

}

function buildCity(D){
  CAMPUS=D.campus.filter(c=>c.pts.length>2);
  // prefer the campus polygon containing (or nearest) the school point
  if(CAMPUS.length){let best=CAMPUS[0],bd=1e18;for(const c of CAMPUS){const ce=centroid(c.pts);const d=pip(0,0,c.pts)?-1:ce[0]**2+ce[1]**2;if(d<bd){bd=d;best=c;}}campusCenter=centroid(best.pts);}
  /* ground */
  const ground=new THREE.Mesh(new THREE.CircleGeometry(R*1.6,64),new THREE.MeshLambertMaterial({color:'#b4c49c'}));
  ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
  /* flat areas */
  const AREA={campus:['#c9d8b2',.012],grass:['#a9ca8b',.02],stadium:['#b7c89c',.022],park:['#9cc47f',.026],wood:['#88b06d',.03],pitch:['#78b46c',.04],track:['#c98a69',.045],water:['#86b8d6',.05]};
  const flat=[];
  const addFlat=(pts,kind)=>{try{const s=new THREE.Shape(pts.map(p=>new THREE.Vector2(p[0],-p[1])));let g=new THREE.ShapeGeometry(s);g.rotateX(-Math.PI/2);g.translate(0,AREA[kind][1],0);g=g.toNonIndexed();g.deleteAttribute('uv');const c=new THREE.Color(AREA[kind][0]),n=g.attributes.position.count,a=new Float32Array(n*3);for(let i=0;i<n;i++){a[i*3]=c.r;a[i*3+1]=c.g;a[i*3+2]=c.b;}g.setAttribute('color',new THREE.BufferAttribute(a,3));flat.push(g);}catch(e){}};
  CAMPUS.forEach(c=>addFlat(c.pts,'campus'));
  D.areas.forEach(a=>addFlat(a.pts,a.kind));
  /* roads as ribbons */
  const rp=[],rc=[],rn=[];
  const W=t=>{const h=t.highway;if(/^(footway|path|pedestrian|steps|cycleway|corridor|bridleway)$/.test(h))return [h==='pedestrian'?5:2.6,'#e8dcc4',.06];if(/^(service|living_street|track)$/.test(h))return [4.2,'#bdbfbd',.055];if(/^(primary|trunk|motorway)/.test(h))return [13,'#a3a7aa',.05];if(/^secondary/.test(h))return [10,'#a7abad',.05];return [6.5,'#b1b4b5',.052];};
  const pushTri=(a,b,c,col)=>{rp.push(...a,...b,...c);for(let k=0;k<3;k++){rc.push(col.r,col.g,col.b);rn.push(0,1,0);}};
  for(const r of D.roads){const [w,cs,y]=W(r.t),col=new THREE.Color(cs),p=r.pts;
    for(let i=0;i<p.length-1;i++){const [x1,z1]=p[i],[x2,z2]=p[i+1];const dx=x2-x1,dz=z2-z1,L=Math.hypot(dx,dz);if(L<.05)continue;const nx=-dz/L*w/2,nz=dx/L*w/2;
      const a=[x1+nx,y,z1+nz],b=[x1-nx,y,z1-nz],c=[x2+nx,y,z2+nz],d=[x2-nx,y,z2-nz];pushTri(a,c,b,col);pushTri(c,d,b,col);}
    for(let i=1;i<p.length-1;i++){const [x,z]=p[i];for(let k=0;k<8;k++){const t1=k/8*Math.PI*2,t2=(k+1)/8*Math.PI*2;pushTri([x,y,z],[x+Math.cos(t2)*w/2,y,z+Math.sin(t2)*w/2],[x+Math.cos(t1)*w/2,y,z+Math.sin(t1)*w/2],col);}}
  }
  const flatMat=new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-1});
  if(flat.length){const m=new THREE.Mesh(THREE.BufferGeometryUtils.mergeBufferGeometries(flat,false),flatMat);m.receiveShadow=true;scene.add(m);}
  if(rp.length){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(rp,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(rn,3));g.setAttribute('color',new THREE.Float32BufferAttribute(rc,3));const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}));m.receiveShadow=true;scene.add(m);}
  /* buildings */
  const tex=windowTexture();
  const geos=[];
  for(const b of D.buildings){
    const a=area(b.pts);if(a<6)continue;
    const ce=centroid(b.pts),camp=isCampus(ce[0],ce[1]);
    const h=heightOf(b.t,camp,a),r=hash(b.id%2147483647);
    const wall=(camp?CAMPUS_WALLS:TOWN_WALLS)[Math.floor(r*(camp?7:4))%(camp?7:4)];
    const roof=(camp?CAMPUS_ROOFS:TOWN_ROOFS)[Math.floor(hash((b.id*7)%2147483647)*5)%(camp?5:3)];
    try{
      const s=new THREE.Shape(b.pts.map(p=>new THREE.Vector2(p[0],-p[1])));
      const g=new THREE.ExtrudeGeometry(s,{depth:h,bevelEnabled:false});g.rotateX(-Math.PI/2);
      const n=g.attributes.normal,uv=g.attributes.uv,cnt=n.count,col=new Float32Array(cnt*3);
      for(let i=0;i<cnt;i++){const top=Math.abs(n.getY(i))>.5,c=top?roof:wall;col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;if(top)uv.setXY(i,.2,3.4);}
      g.setAttribute('color',new THREE.BufferAttribute(col,3));
      geos.push(g);
      const bb=bbox(b.pts),name=(b.t['name:ko']||b.t.name||'').trim();
      const idx=B.length;B.push(Object.assign(bb,{pts:b.pts,h,camp,name,ce,rad:Math.sqrt(a/Math.PI)}));gridAdd(idx,bb);
    }catch(e){}
  }
  const bmat=new THREE.MeshLambertMaterial({map:tex,vertexColors:true});
  for(let i=0;i<geos.length;i+=400){const m=new THREE.Mesh(THREE.BufferGeometryUtils.mergeBufferGeometries(geos.slice(i,i+400),false),bmat);m.castShadow=true;m.receiveShadow=true;scene.add(m);}
  /* trees */
  const tp=[],rnd=rng(Math.round(LAT*1e4)^Math.round(LON*1e4));
  const scatter=(pts,per,max)=>{const bb=bbox(pts),n=Math.min(max,Math.round(area(pts)/per));let made=0;for(let k=0;k<n*4&&made<n;k++){const x=bb.minx+rnd()*(bb.maxx-bb.minx),z=bb.minz+rnd()*(bb.maxz-bb.minz);if(!pip(x,z,pts)||inBuilding(x,z)>=0)continue;tp.push([x,z,.75+rnd()*.6,rnd()<.35]);made++;}};
  D.areas.forEach(a=>{if(a.kind==='wood')scatter(a.pts,90,500);else if(a.kind==='park')scatter(a.pts,220,200);else if(a.kind==='grass')scatter(a.pts,500,60);});
  CAMPUS.forEach(c=>scatter(c.pts,700,400));
  if(!CAMPUS.length)scatter([[-300,-300],[300,-300],[300,300],[-300,300]],1500,200);
  const N=Math.min(tp.length,2600);
  if(N){
    const round=tp.slice(0,N).filter(t=>!t[3]),pine=tp.slice(0,N).filter(t=>t[3]);
    const d=new THREE.Object3D();
    const mk=(arr,geo,color,y)=>{if(!arr.length)return;const m=new THREE.InstancedMesh(geo,new THREE.MeshLambertMaterial({color}),arr.length);arr.forEach((t,i)=>{d.position.set(t[0],y*t[2],t[1]);d.scale.setScalar(t[2]);d.updateMatrix();m.setMatrixAt(i,d.matrix);});m.castShadow=true;scene.add(m);};
    const trunkGeo=new THREE.CylinderGeometry(.18,.26,2.2,6);
    mk(round,new THREE.IcosahedronGeometry(2.3,1),'#6f9d58',3.9);mk(round,trunkGeo,'#6b5342',1.1);
    mk(pine,new THREE.ConeGeometry(1.8,5.6,7),'#557f4c',4.6);mk(pine,trunkGeo,'#6b5342',1.1);
  }
  return D;
}

const mini=$('mini'),mg=mini.getContext('2d');let miniStatic=null,MS=1;
function drawMiniStatic(){
  const w=mini.clientWidth,dpr=Math.min(2,devicePixelRatio||1);mini.width=w*dpr;mini.height=w*dpr;MS=w*dpr/(R*2);
  const c=document.createElement('canvas');c.width=mini.width;c.height=mini.height;const g=c.getContext('2d');

  const poly=(pts,fill)=>{g.beginPath();pts.forEach((p,i)=>{const [a,b]=T(p[0],p[1]);i?g.lineTo(a,b):g.moveTo(a,b);});g.closePath();g.fillStyle=fill;g.fill();};
  CAMPUS.forEach(cp=>poly(cp.pts,'#cfe0b9'));

}

/* ---------- main loop ---------- */
const clock=new THREE.Clock();const tmp=new THREE.Vector3();let frame=0,nearT=0,camPos=null;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,clock.getDelta());frame++;
  let f=(keys.f?1:0)-(keys.b?1:0)-jy, s=(keys.r?1:0)-(keys.l?1:0)+jx;
  const mag=Math.min(1,Math.hypot(f,s));
  if(mag>.08){
    f/=Math.max(1,Math.hypot(f,s));s/=Math.max(1,Math.hypot(f,s));
    const sy=Math.sin(S.yaw),cy=Math.cos(S.yaw);
    const vx=(-sy*f+cy*s),vz=(-cy*f-sy*s);
    const run=S.run||keys.shift||Math.hypot(jx,jy)>.95;
    const sp=(run?8.5:4.2)*dt*Math.max(.35,mag);
    const nx=S.x+vx*sp,nz=S.z+vz*sp;
    if(!blocked(nx,nz)){S.x=nx;S.z=nz;}else if(!blocked(nx,S.z)){S.x=nx;}else if(!blocked(S.x,nz)){S.z=nz;}
    const target=Math.atan2(vx,vz);let d=target-me.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));me.rotation.y+=d*Math.min(1,dt*12);
    S.walkT+=dt*(run?13:8.5);S.speed=1;
  }else{S.speed=Math.max(0,S.speed-dt*4);}
  const sw=Math.sin(S.walkT)*.6*S.speed;
  me.userData.legs[0].rotation.x=sw;me.userData.legs[1].rotation.x=-sw;me.userData.arms[0].rotation.x=-sw*.8;me.userData.arms[1].rotation.x=sw*.8;
  me.position.set(S.x,Math.abs(Math.sin(S.walkT))*.05*S.speed,S.z);
  // camera follow
  const cp=Math.cos(S.pitch),tx=S.x,ty=1.5,tz=S.z;
  const want=tmp.set(tx+Math.sin(S.yaw)*S.dist*cp,ty+Math.sin(S.pitch)*S.dist,tz+Math.cos(S.yaw)*S.dist*cp);
  if(!camPos)camPos=want.clone();else camPos.lerp(want,Math.min(1,dt*8));
  cam.position.copy(camPos);cam.lookAt(tx,ty,tz);
  sun.position.set(S.x+70,120,S.z+45);sun.target.position.set(S.x,0,S.z);
  if(frame%8===0)for(const g of signs){const dx=g.b.ce[0]-S.x,dz=g.b.ce[1]-S.z;g.s.visible=dx*dx+dz*dz<(S.high?400:170)**2;}
  if((nearT+=dt)>.25){nearT=0;let best=null,bd=1e9;for(const g of signs){const d=Math.hypot(g.b.ce[0]-S.x,g.b.ce[1]-S.z)-g.b.rad;if(d<bd){bd=d;best=g.b;}}
    const el=$('near');if(best&&bd<14){el.hidden=false;el.innerHTML='지금 앞: <b></b>';el.querySelector('b').textContent=best.name;}else el.hidden=true;}
  renderer.render(scene,cam);
  drawMini();
}

  // start at the school point, facing the campus centre (or the nearest named building)
  let fx=campusCenter[0],fz=campusCenter[1];
  if(Math.hypot(fx,fz)<20&&named.length){const nb=named.slice().sort((a,b)=>Math.hypot(a.ce[0],a.ce[1])-Math.hypot(b.ce[0],b.ce[1]))[0];fx=nb.ce[0];fz=nb.ce[1];}
  goTo(0,0,fx,fz);
  if(Math.hypot(fx-S.x,fz-S.z)<1){S.yaw=0;}
  drawMiniStatic();
  $('load').hidden=true;
  setTimeout(()=>$('hint').classList.add('fade'),7000);setTimeout(()=>$('hint').hidden=true,7800);
  loop();
})();
})();
</script>
