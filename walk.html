<html lang="ko">
<head>

{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<style>
/* Layout: full-screen 3D campus; thin top bar, minimap top-right, joystick bottom-left, place list as a side sheet. */
:root{
  --panel:rgba(248,250,246,.92); --panel-solid:#F7F9F5; --ink:#1B252E; --muted:#5B686D; --line:rgba(27,37,46,.14);
  --accent:#1E6B62; --accent-ink:#FFFFFF; --sky:#cfdde6;
  --shadow:0 1px 2px rgba(20,30,35,.08),0 6px 20px rgba(20,30,35,.12);
  --f-display:"Nanum Myeongjo","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --panel:rgba(21,28,32,.9); --panel-solid:#151C20; --ink:#E5ECE9; --muted:#93A19E; --line:rgba(229,236,233,.16);
  --accent:#55B6A8; --accent-ink:#0B1513; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent}
button,a{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;
  padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));pointer-events:none}
.top > *{pointer-events:auto}
.btn{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:10px;padding:7px 11px;font-size:.84rem;cursor:pointer;text-decoration:none;box-shadow:var(--shadow);white-space:nowrap}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.title{flex:1;min-width:0;background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:10px;padding:5px 12px;box-shadow:var(--shadow)}
.title b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.02rem;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title span{display:block;font-size:.72rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mini{position:fixed;z-index:4;right:max(10px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));width:150px;height:150px;border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--panel-solid);cursor:crosshair}
.joy{position:fixed;z-index:5;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.26);border:2px solid rgba(255,255,255,.75);box-shadow:var(--shadow);touch-action:none}
.joy .knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.94);box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none}
.side{position:fixed;z-index:5;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.near{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(48px + env(safe-area-inset-bottom,0px));background:#1f2428;color:#fff;border-radius:99px;padding:7px 15px;font-size:.86rem;box-shadow:var(--shadow);white-space:nowrap;max-width:calc(100% - 340px);overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.near b{font-weight:700}
.hint{position:fixed;z-index:5;left:50%;transform:translateX(-50%);top:calc(66px + env(safe-area-inset-top,0px));background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 13px;font-size:.78rem;box-shadow:var(--shadow);white-space:nowrap;transition:opacity .6s}
.hint.fade{opacity:0}
.note{position:fixed;z-index:5;left:max(10px,env(safe-area-inset-left,0px));top:calc(66px + env(safe-area-inset-top,0px));max-width:min(320px,calc(100% - 190px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:.76rem;line-height:1.5;color:var(--muted);box-shadow:var(--shadow)}
.note a{color:var(--accent)}
.places{position:fixed;z-index:6;top:0;bottom:0;right:0;width:min(320px,88vw);background:var(--panel-solid);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.places header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.places header b{flex:1;font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.places ul{list-style:none;margin:0;padding:6px;overflow-y:auto;flex:1}
.places li button{width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:9px 10px;cursor:pointer;font-size:.9rem}
.places li button:hover{background:rgba(30,107,98,.1)}
.places .empty{padding:14px;color:var(--muted);font-size:.85rem;line-height:1.6}
.attr{position:fixed;z-index:4;right:max(8px,env(safe-area-inset-right,0px));bottom:calc(6px + env(safe-area-inset-bottom,0px));font-size:.68rem;color:#2b3640;background:rgba(255,255,255,.78);border-radius:6px;padding:2px 7px}
.attr a{color:inherit}
.load{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:var(--sky);padding:16px}
.load .box{background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);max-width:420px;display:grid;gap:10px;text-align:center}
.load h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.load p{margin:0;color:var(--muted);font-size:.88rem;line-height:1.6}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:30%;background:var(--accent);border-radius:99px;animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
.fader{position:fixed;inset:0;z-index:9;background:var(--sky);opacity:0;pointer-events:none;transition:opacity .25s}
.fader.on{opacity:1}
@media (max-width:640px){
  #mini{width:112px;height:112px}
  .near{max-width:calc(100% - 40px);bottom:calc(182px + env(safe-area-inset-bottom,0px))}
  .hint{white-space:normal;text-align:center;width:calc(100% - 24px);border-radius:12px}
  .note{max-width:calc(100% - 140px)}
}
@media (hover:hover) and (pointer:fine){.joy{opacity:.5}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}.fader{transition:none}}
body.over .joy,body.over #runBtn{display:none}
</style>
</head>
<body>
<canvas id="c" aria-label="3D 캠퍼스"></canvas>
<div class="top">
  <a class="btn" href="./">← 지도</a>
  <div class="title"><b id="name">캠퍼스</b><span id="sub">건물 정보를 받는 중</span></div>
  <button class="btn" id="placesBtn">가 볼 곳</button>
</div>
<canvas id="mini" aria-label="미니맵: 누르면 그 자리로 이동"></canvas>
<div class="hint" id="hint">WASD·방향키로 걷기 · 화면을 끌어 둘러보기 · Shift 달리기</div>
<div class="note" id="note" hidden></div>
<div class="near" id="near" hidden></div>
<div class="joy" id="joy" aria-label="이동 조이스틱"><div class="knob" id="knob"></div></div>
<div class="side">
  <button class="btn" id="hqBtn" aria-pressed="false">고화질</button>
  <button class="btn" id="runBtn" aria-pressed="false">달리기</button>
  <button class="btn" id="viewBtn">걸어서 들어가기</button>
</div>
<aside class="places" id="places" hidden>
  <header><b>가 볼 곳</b><button class="btn" id="placesClose">닫기</button></header>
  <ul id="placeList"></ul>
</aside>
<div class="attr">건물·길 <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap 기여자</a> · 지형 AWS Terrain Tiles</div>
<div class="fader" id="fader"></div>
<div class="load" id="load">
  <div class="box">
    <h1 id="loadTitle">캠퍼스로 가는 중</h1>
    <p id="loadMsg">3D 엔진을 준비하는 중입니다.</p>
    <div class="bar" id="loadBar"><i></i></div>
    <div id="loadActions" hidden style="display:flex;gap:8px;justify-content:center">
      <button class="btn on" id="retry">다시 시도</button><a class="btn" href="./">지도로 돌아가기</a>
    </div>
  </div>
</div>
<script>
// If the 3D engine never loads (blocked CDN, very old browser), say so instead of spinning forever.
setTimeout(function(){
  if(window.__mod)return;
  document.getElementById('loadMsg').textContent='3D 엔진을 불러오지 못했습니다. 인터넷 연결을 확인하거나 최신 Chrome·Safari로 열어 주세요.';
  document.getElementById('loadBar').hidden=true;document.getElementById('loadActions').hidden=false;
},25000);
document.getElementById('retry').onclick=function(){location.reload();};
</script>
<script type="module">
import * as THREE from 'three';
import {Sky} from 'three/addons/objects/Sky.js';
import {mergeGeometries,mergeVertices} from 'three/addons/utils/BufferGeometryUtils.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {SMAAPass} from 'three/addons/postprocessing/SMAAPass.js';
window.__mod=true;

const $=id=>document.getElementById(id);
const P=new URLSearchParams(location.search);
const LAT=parseFloat(P.get('lat')),LON=parseFloat(P.get('lon'));
const NAME=(P.get('name')||'캠퍼스').slice(0,60);
const MOCK=P.has('mock');
const R=750; // metres around the school point
const MOBILE=matchMedia('(pointer:coarse)').matches||innerWidth<700;
let HQ=!MOBILE;try{const s=localStorage.getItem('walk:hq');if(s!==null)HQ=s==='1';}catch(e){}
$('name').textContent=NAME;document.title=NAME+' 걷기';
$('loadTitle').textContent=NAME+'(으)로 가는 중';
if(MOBILE)$('hint').textContent='왼쪽 아래 동그라미로 걷기 · 화면을 끌어 둘러보기 · 두 손가락으로 확대';
const status=t=>{$('loadMsg').textContent=t;};
const fail=t=>{status(t);$('loadBar').hidden=true;$('loadActions').hidden=false;};
const setHQBtn=()=>{$('hqBtn').classList.toggle('on',HQ);$('hqBtn').setAttribute('aria-pressed',HQ);$('hqBtn').textContent=HQ?'고화질 켜짐':'고화질';};
setHQBtn();

if(!isFinite(LAT)||!isFinite(LON)){fail('학교 위치 정보가 없습니다. 지도에서 학교를 고른 뒤 “걸어서 들어가기”를 눌러 주세요.');throw new Error('no position');}

/* ---------- projection: local metres, x east, z south ---------- */
const KX=Math.cos(LAT*Math.PI/180)*111320,KZ=110540;
const px=lon=>(lon-LON)*KX, pz=lat=>-(lat-LAT)*KZ;

/* ---------- OpenStreetMap (Overpass), fetched in the visitor's browser ---------- */
const Q=`[out:json][timeout:90];(`+
 `way["building"](around:${R},${LAT},${LON});`+
 `way["highway"](around:${R},${LAT},${LON});`+
 `way["leisure"~"^(pitch|park|garden|track|stadium)$"](around:${R},${LAT},${LON});`+
 `way["landuse"~"^(grass|forest|recreation_ground|meadow|village_green)$"](around:${R},${LAT},${LON});`+
 `way["natural"~"^(water|wood)$"](around:${R},${LAT},${LON});`+
 `way["amenity"~"^(university|college|parking)$"](around:${R},${LAT},${LON});`+
 `relation["amenity"~"^(university|college)$"](around:${R},${LAT},${LON});`+
 `);out geom;`;
const EPS=['https://maps.mail.ru/osm/tools/overpass/api/interpreter','https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter'];
async function getOSM(){
  if(MOCK)return (await fetch('mock-osm.json')).json();
  const ll=LAT.toFixed(4)+','+LON.toFixed(4),key='osm5:'+ll;
  // older copies (osm3/osm4) cover a smaller area, so they are dropped rather than reused
  try{for(const k of Object.keys(localStorage))if(/^osm[34]:/.test(k))localStorage.removeItem(k);}catch(e){}
  try{const c=localStorage.getItem(key);if(c)return JSON.parse(c);}catch(e){}
  const t0=Date.now();
  const tick=setInterval(()=>status(`OpenStreetMap에서 건물과 길 정보를 받는 중입니다… ${Math.round((Date.now()-t0)/1000)}초 (보통 20초~1분, 한 번 받으면 다음엔 바로 열려요)`),1000);
  const ctrls=EPS.map(()=>new AbortController());
  const tries=EPS.map((ep,i)=>(async()=>{
    const t=setTimeout(()=>ctrls[i].abort(),100000);
    try{
      const r=await fetch(ep,{method:'POST',body:'data='+encodeURIComponent(Q),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ctrls[i].signal});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json();
      if(!j||!Array.isArray(j.elements))throw new Error('bad data');
      if(j.remark&&/timed out|runtime error/i.test(j.remark)&&!j.elements.length)throw new Error(j.remark);
      return {j,i};
    }finally{clearTimeout(t);}
  })());
  let res;
  try{res=await Promise.any(tries);}finally{clearInterval(tick);}
  ctrls.forEach((c,i)=>{if(i!==res.i)c.abort();});
  saveCache(key,res.j);
  return res.j;
}
function saveCache(key,j){
  const KEEP=['building','name','name:ko','height','building:levels','building:material','building:colour','roof:colour','highway','lanes','amenity','leisure','landuse','natural','location','layer','area','parking'];
  const rd=g=>({lat:+g.lat.toFixed(6),lon:+g.lon.toFixed(6)});
  const slim={elements:(j.elements||[]).map(e=>{const t={};if(e.tags)for(const k of KEEP)if(e.tags[k]!==undefined)t[k]=e.tags[k];
    const o={type:e.type,id:e.id,tags:t};if(e.geometry)o.geometry=e.geometry.map(rd);if(e.members)o.members=e.members.filter(m=>m.geometry).map(m=>({role:m.role,geometry:m.geometry.map(rd)}));return o;})};
  try{
    const idx=JSON.parse(localStorage.getItem('osm5:index')||'[]').filter(k=>k!==key);idx.push(key);
    while(idx.length>6){try{localStorage.removeItem(idx.shift());}catch(e){}}
    const s=JSON.stringify(slim);
    for(;;){try{localStorage.setItem(key,s);break;}catch(e){if(!idx.length||idx[0]===key)break;localStorage.removeItem(idx.shift());}}
    localStorage.setItem('osm5:index',JSON.stringify(idx));
  }catch(e){}
}

/* ---------- terrain heights: AWS Terrain Tiles (terrarium PNG) ---------- */
const STEP=4,NG=Math.round(2*R/STEP)+1;
const HG=new Float32Array(NG*NG);
async function getTerrain(){
  if(MOCK){for(let j=0;j<NG;j++)for(let i=0;i<NG;i++){const x=-R+i*STEP,z=-R+j*STEP;HG[j*NG+i]=6*Math.sin(x/90)+4*Math.cos(z/70)+Math.max(0,(-z-200)/8)+Math.max(0,-z-260)*.4;}return true;}
  const Z=15,n=2**Z;
  const lon2x=lon=>(lon+180)/360*n;
  const lat2y=lat=>{const r=lat*Math.PI/180;return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n;};
  const dLat=(R+60)/KZ,dLon=(R+60)/KX;
  const x0=Math.floor(lon2x(LON-dLon)),x1=Math.floor(lon2x(LON+dLon)),y0=Math.floor(lat2y(LAT+dLat)),y1=Math.floor(lat2y(LAT-dLat));
  const W=(x1-x0+1)*256,H=(y1-y0+1)*256;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d',{willReadFrequently:true});
  const jobs=[];
  for(let tx=x0;tx<=x1;tx++)for(let ty=y0;ty<=y1;ty++)jobs.push((async()=>{
    const r=await fetch(`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${Z}/${tx}/${ty}.png`);
    if(!r.ok)throw new Error('tile');
    const bm=await createImageBitmap(await r.blob());g.drawImage(bm,(tx-x0)*256,(ty-y0)*256);
  })());
  await Promise.all(jobs);
  const d=g.getImageData(0,0,W,H).data;
  const hp=(ix,iy)=>{ix=Math.max(0,Math.min(W-1,ix));iy=Math.max(0,Math.min(H-1,iy));const k=(iy*W+ix)*4;return d[k]*256+d[k+1]+d[k+2]/256-32768;};
  const sample=(lat,lon)=>{const fx=(lon2x(lon)-x0)*256-.5,fy=(lat2y(lat)-y0)*256-.5,ix=Math.floor(fx),iy=Math.floor(fy),ax=fx-ix,ay=fy-iy;
    return hp(ix,iy)*(1-ax)*(1-ay)+hp(ix+1,iy)*ax*(1-ay)+hp(ix,iy+1)*(1-ax)*ay+hp(ix+1,iy+1)*ax*ay;};
  const h0=sample(LAT,LON);
  for(let j=0;j<NG;j++)for(let i=0;i<NG;i++){const x=-R+i*STEP,z=-R+j*STEP;HG[j*NG+i]=sample(LAT-z/KZ,LON+x/KX)-h0;}
  // smooth: raw elevation is ~30 m resolution and noisy over buildings
  const tmp=new Float32Array(HG.length);
  for(let pass=0;pass<3;pass++){
    for(let j=0;j<NG;j++)for(let i=0;i<NG;i++){let s=0,c=0;for(let dj=-2;dj<=2;dj++)for(let di=-2;di<=2;di++){const a=i+di,b=j+dj;if(a<0||b<0||a>=NG||b>=NG)continue;s+=HG[b*NG+a];c++;}tmp[j*NG+i]=s/c;}
    HG.set(tmp);
  }
  return true;
}
function heightAt(x,z){
  const fx=(x+R)/STEP,fz=(z+R)/STEP;let i=Math.floor(fx),j=Math.floor(fz);
  i=Math.max(0,Math.min(NG-2,i));j=Math.max(0,Math.min(NG-2,j));
  const ax=Math.min(1,Math.max(0,fx-i)),az=Math.min(1,Math.max(0,fz-j));
  return HG[j*NG+i]*(1-ax)*(1-az)+HG[j*NG+i+1]*ax*(1-az)+HG[(j+1)*NG+i]*(1-ax)*az+HG[(j+1)*NG+i+1]*ax*az;
}

const slopeAt=(x,z)=>Math.hypot(heightAt(x+12,z)-heightAt(x-12,z),heightAt(x,z+12)-heightAt(x,z-12))/24;
const STEEP=.2; // steeper than this and not built on: treated as wooded hillside

/* ---------- geometry helpers ---------- */
function ring(geom){const p=geom.map(g=>[px(g.lon),pz(g.lat)]);if(p.length>2){const a=p[0],b=p[p.length-1];if(Math.abs(a[0]-b[0])<.01&&Math.abs(a[1]-b[1])<.01)p.pop();}return p;}
const line=geom=>geom.map(g=>[px(g.lon),pz(g.lat)]);
function pip(x,z,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],zi=poly[i][1],xj=poly[j][0],zj=poly[j][1];if(((zi>z)!==(zj>z))&&(x<(xj-xi)*(z-zi)/(zj-zi)+xi))c=!c;}return c;}
function centroid(p){let x=0,z=0;for(const q of p){x+=q[0];z+=q[1];}return [x/p.length,z/p.length];}
function sarea(p){let a=0;for(let i=0,j=p.length-1;i<p.length;j=i++)a+=(p[j][0]+p[i][0])*(p[j][1]-p[i][1]);return a/2;}
const area=p=>Math.abs(sarea(p));

/* ---------- parse ---------- */
function parse(j){
  const D={campus:[],buildings:[],roads:[],areas:[]};
  for(const e of (j.elements||[])){
    const t=e.tags||{};
    if(e.type==='relation'&&/^(university|college)$/.test(t.amenity||'')){
      const pts=[];for(const m of (e.members||[]))if(m.geometry&&m.role!=='inner')for(const g of m.geometry)pts.push([px(g.lon),pz(g.lat)]);
      if(pts.length>2)D.campus.push({pts:hull(pts)});continue;
    }
    if(e.type!=='way'||!e.geometry||e.geometry.length<2)continue;
    if(t.amenity==='parking'&&!t.building){if(/^(underground|multi-storey|rooftop)$/.test(t.parking||''))continue;const p=ring(e.geometry);if(p.length>2)D.areas.push({kind:'parking',pts:p});continue;}
    if(t.highway&&t.area==='yes'&&/^(pedestrian|footway|service)$/.test(t.highway)){const p=ring(e.geometry);if(p.length>2)D.areas.push({kind:t.highway==='service'?'parking':'plaza',pts:p});continue;}
    if(/^(university|college)$/.test(t.amenity||'')&&!t.building){const p=ring(e.geometry);if(p.length>2)D.campus.push({pts:p});continue;}
    if(t.building){
      if(t.location==='underground'||parseFloat(t.layer)<0||t.building==='construction')continue;
      const p=ring(e.geometry);if(p.length<3)continue;D.buildings.push({id:e.id,t,pts:p});continue;
    }
    if(t.highway){if(/^(construction|proposed|elevator|platform|bus_stop)$/.test(t.highway))continue;D.roads.push({t,pts:line(e.geometry)});continue;}
    const kind=t.natural==='water'?'water':(t.natural==='wood'||t.landuse==='forest')?'wood':t.leisure==='pitch'?'pitch':t.leisure==='track'?'track':(t.leisure==='park'||t.leisure==='garden')?'park':t.leisure==='stadium'?'stadium':'grass';
    const p=ring(e.geometry);if(p.length>2)D.areas.push({kind,pts:p});
  }
  return D;
}

  const hair=new THREE.Mesh(new THREE.SphereGeometry(.245,20,16,0,Math.PI*2,0,Math.PI*.56),M('#2b2420',.6));hair.position.y=1.79;hair.rotation.x=-.22;g.add(hair);
  const bag=new THREE.Mesh(new THREE.BoxGeometry(.4,.5,.2),M('#2f6f66'));bag.position.set(0,1.22,-.3);g.add(bag);
  g.traverse(o=>{if(o.isMesh)o.castShadow=true;});g.userData={legs,arms};return g;
}
const me=makeStudent();scene.add(me);

/* ---------- input ---------- */
const S={x:0,z:0,yaw:0,pitch:.42,dist:14,run:false,over:true,walkT:0,speed:0};
const O={yaw:.7,pitch:.6,dist:R*1.45,touched:false}; // whole-campus view
const V=()=>S.over?O:S,DMAX=()=>S.over?R*3:120,DMIN=()=>S.over?160:3.5;
const keys={};const KM={KeyW:'f',ArrowUp:'f',KeyS:'b',ArrowDown:'b',KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r'};
addEventListener('keydown',e=>{if(e.key==='Shift')keys.shift=true;const k=KM[e.code];if(k){keys[k]=true;e.preventDefault();}});
addEventListener('keyup',e=>{if(e.key==='Shift')keys.shift=false;const k=KM[e.code];if(k)keys[k]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
const ptrs=new Map();let pinch0=0,dist0=0;
canvas.addEventListener('pointerdown',e=>{O.touched=true;canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);dist0=V().dist;}});
canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
  if(ptrs.size===2){ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0>0)V().dist=Math.min(DMAX(),Math.max(DMIN(),dist0*pinch0/d));return;}
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;const v=V();v.yaw-=dx*.0065;v.pitch=Math.min(1.4,Math.max(S.over?.22:.04,v.pitch+dy*.0045));});
const endPtr=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=0;};
canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('wheel',e=>{e.preventDefault();O.touched=true;const v=V();v.dist=Math.min(DMAX(),Math.max(DMIN(),v.dist*Math.exp(e.deltaY*.0011)));},{passive:false});
const joy=$('joy'),knob=$('knob');let jx=0,jy=0,jid=null;
function joyMove(e){const r=joy.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const m=Math.hypot(dx,dy),max=r.width*.38;if(m>max){dx*=max/m;dy*=max/m;}jx=dx/max;jy=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`;}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);joyMove(e);e.preventDefault();});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)joyMove(e);});
const joyEnd=e=>{if(e.pointerId!==jid)return;jid=null;jx=jy=0;knob.style.transform='';};
joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);
$('runBtn').onclick=e=>{S.run=!S.run;e.currentTarget.classList.toggle('on',S.run);e.currentTarget.setAttribute('aria-pressed',S.run);};
function setMode(over){
  S.over=over;document.body.classList.toggle('over',over);
  const b=$('viewBtn');b.textContent=over?'걸어서 들어가기':'전체 보기';b.classList.toggle('on',over);
  sky.visible=!over;scene.background=over?BG:null;scene.fog=over?null:FOG;farGround.forEach(m=>m.visible=!over);
  cam.near=over?8:.15;cam.far=over?8000:4000;cam.updateProjectionMatrix();
  const c=sun.shadow.camera,s=over?R*1.25:SH;c.left=-s;c.right=s;c.top=s;c.bottom=-s;c.far=over?3600:700;c.updateProjectionMatrix();sun.shadow.normalBias=over?2:.5;
  if(over){const hc=heightAt(0,0);sun.position.set(SUN_DIR.x*1700,hc+SUN_DIR.y*1700,SUN_DIR.z*1700);sun.target.position.set(0,hc,0);}
  if(aoPass)Object.assign(aoPass.configuration,over?{aoRadius:14,distanceFalloff:1,intensity:3.2}:{aoRadius:3.2,distanceFalloff:1.2,intensity:2.6});
  me.visible=!over;camPos=null;
  if(over)for(const l of labels)l.s.visible=!!l.top;
  const h=$('hint');h.hidden=false;h.classList.remove('fade');h.textContent=over?'끌어서 돌려 보기 · 휠·두 손가락으로 확대 · ‘걸어서 들어가기’로 캠퍼스 산책':'WASD·방향키로 걷기 · 화면을 끌어 둘러보기 · Shift 달리기';
  clearTimeout(setMode.t);setMode.t=setTimeout(()=>h.classList.add('fade'),7000);
}
$('viewBtn').onclick=()=>setMode(!S.over);

/* ---------- places & teleport ---------- */
function fadeTo(fn){const f=$('fader');f.classList.add('on');setTimeout(()=>{fn();f.classList.remove('on');},260);}
function goTo(x,z,fx,fz){const p=freeNear(x,z);S.x=p[0];S.z=p[1];if(fx!==undefined){const dx=fx-S.x,dz=fz-S.z;S.yaw=Math.atan2(-dx,-dz);me.rotation.y=Math.atan2(dx,dz);}camPos=null;}
function goToBuilding(b){fadeTo(()=>{if(S.over)setMode(false);const dx=S.x-b.ce[0],dz=S.z-b.ce[1],L=Math.hypot(dx,dz)||1;goTo(b.ce[0]+dx/L*(b.rad+4),b.ce[1]+dz/L*(b.rad+4),b.ce[0],b.ce[1]);});}
$('placesBtn').onclick=()=>{$('places').hidden=!$('places').hidden;};
$('placesClose').onclick=()=>{$('places').hidden=true;};
function fillPlaces(list){
  const ul=$('placeList');ul.textContent='';
  if(!list.length){const li=document.createElement('li');li.className='empty';li.textContent='OpenStreetMap에 이름이 적힌 건물이 아직 없습니다. 미니맵을 눌러 원하는 곳으로 가 보세요.';ul.appendChild(li);return;}
  list.slice().sort((a,b)=>a.name.localeCompare(b.name,'ko')).forEach(b=>{const li=document.createElement('li'),bt=document.createElement('button');bt.textContent=b.name;bt.onclick=()=>{$('places').hidden=true;goToBuilding(b);};li.appendChild(bt);ul.appendChild(li);});
}

/* ---------- minimap ---------- */
const mini=$('mini'),mg=mini.getContext('2d');let miniStatic=null,MS=1;
function drawMiniStatic(){
  if(!lcCanvas)return;const w=mini.clientWidth,dpr=Math.min(2,devicePixelRatio||1);mini.width=w*dpr;mini.height=w*dpr;MS=w*dpr/(R*2);
  const c=cnv(mini.width,mini.height),g=c.getContext('2d');g.drawImage(lcCanvas,0,0,c.width,c.height);
  B.forEach(b=>{g.beginPath();b.pts.forEach((p,i)=>{const a=(p[0]+R)*MS,z=(p[1]+R)*MS;i?g.lineTo(a,z):g.moveTo(a,z);});g.closePath();g.fillStyle=b.camp?'#f3efe6':'#c9cbc7';g.fill();g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=.6;g.stroke();});
  miniStatic=c;
}
mini.addEventListener('click',e=>{const r=mini.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*R*2-R,z=(e.clientY-r.top)/r.height*R*2-R;const bi=inBuilding(x,z);if(bi>=0){goToBuilding(B[bi]);return;}fadeTo(()=>goTo(x,z));});
function drawMini(){if(!miniStatic)return;const dpr=mini.width/mini.clientWidth;mg.drawImage(miniStatic,0,0);const x=(S.x+R)*MS,y=(S.z+R)*MS;
  mg.save();mg.translate(x,y);mg.rotate(-me.rotation.y+Math.PI);mg.fillStyle='#e2704f';mg.strokeStyle='#fff';mg.lineWidth=1.6*dpr;mg.beginPath();mg.moveTo(0,-7*dpr);mg.lineTo(5*dpr,6*dpr);mg.lineTo(0,3*dpr);mg.lineTo(-5*dpr,6*dpr);mg.closePath();mg.fill();mg.stroke();mg.restore();}

/* ---------- loop ---------- */
const clock=new THREE.Clock(),want=new THREE.Vector3();let frame=0,nearT=0,camPos=null;
function loop(){
  requestAnimationFrame(loop);const dt=Math.min(.05,clock.getDelta());frame++;
  let f=(keys.f?1:0)-(keys.b?1:0)-jy,s=(keys.r?1:0)-(keys.l?1:0)+jx;const mag=Math.min(1,Math.hypot(f,s));
  if(mag>.08&&!S.over){const k=Math.max(1,Math.hypot(f,s));f/=k;s/=k;const sy=Math.sin(S.yaw),cy=Math.cos(S.yaw);const vx=-sy*f+cy*s,vz=-cy*f-sy*s;
    const run=S.run||keys.shift||Math.hypot(jx,jy)>.95;const sp=(run?8.5:4.2)*dt*Math.max(.35,mag);const nx=S.x+vx*sp,nz=S.z+vz*sp;
    if(!blocked(nx,nz)){S.x=nx;S.z=nz;}else if(!blocked(nx,S.z))S.x=nx;else if(!blocked(S.x,nz))S.z=nz;
    let d=Math.atan2(vx,vz)-me.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));me.rotation.y+=d*Math.min(1,dt*12);S.walkT+=dt*(run?13:8.5);S.speed=1;}
  else S.speed=Math.max(0,S.speed-dt*4);
  const sw=Math.sin(S.walkT)*.6*S.speed,U=me.userData;U.legs[0].rotation.x=sw;U.legs[1].rotation.x=-sw;U.arms[0].rotation.x=-sw*.8;U.arms[1].rotation.x=sw*.8;
  const gy=heightAt(S.x,S.z);me.position.set(S.x,gy+Math.abs(Math.sin(S.walkT))*.05*S.speed,S.z);
  if(S.over){
    if(!O.touched)O.yaw+=dt*.035;
    const cl=v=>Math.max(-R*.3,Math.min(R*.3,v)),cx=cl(campusCenter[0]),cz=cl(campusCenter[1]),cy0=heightAt(cx,cz)+10,cp=Math.cos(O.pitch);
    want.set(cx+Math.sin(O.yaw)*O.dist*cp,cy0+Math.sin(O.pitch)*O.dist,cz+Math.cos(O.yaw)*O.dist*cp);
    if(!camPos)camPos=want.clone();else camPos.lerp(want,Math.min(1,dt*6));
    cam.position.copy(camPos);cam.lookAt(cx,cy0,cz);
  }else{
  const cp=Math.cos(S.pitch),ty=gy+1.5;
  want.set(S.x+Math.sin(S.yaw)*S.dist*cp,ty+Math.sin(S.pitch)*S.dist,S.z+Math.cos(S.yaw)*S.dist*cp);
  want.y=Math.max(want.y,heightAt(want.x,want.z)+1.2);
  // keep the camera out of buildings: walk from the player toward the camera and stop just before a wall
  {const sx=want.x-S.x,sy=want.y-ty,sz=want.z-S.z,L=Math.hypot(sx,sz);
   const hitAt=(x,z,y)=>{for(const [ox,oz] of [[0,0],[.7,0],[-.7,0],[0,.7],[0,-.7]]){const i=inBuilding(x+ox,z+oz);if(i>=0&&y<B[i].top+1.2)return true;}return false;};
   for(let d=.5;d<L;d+=.4){const f=d/L,x=S.x+sx*f,z=S.z+sz*f,y=ty+sy*f;
     if(hitAt(x,z,y)){const g=Math.max(.12,(d-1)/L);want.set(S.x+sx*g,Math.max(ty+sy*g,heightAt(S.x+sx*g,S.z+sz*g)+1.2),S.z+sz*g);if(camPos)camPos.copy(want);break;}}}
  if(!camPos)camPos=want.clone();else camPos.lerp(want,Math.min(1,dt*8));
  cam.position.copy(camPos);cam.lookAt(S.x,ty,S.z);
  sun.position.set(S.x+SUN_DIR.x*400,gy+SUN_DIR.y*400,S.z+SUN_DIR.z*400);sun.target.position.set(S.x,gy,S.z);
  }
  if(frame%10===0){if(S.over)for(const l of labels)l.s.visible=!!l.top;else{const lim=240**2;for(const l of labels){const dx=l.b.ce[0]-S.x,dz=l.b.ce[1]-S.z;l.s.visible=dx*dx+dz*dz<lim;}}}
  if((nearT+=dt)>.25){nearT=0;let best=null,bd=1e9;for(const l of labels){const d=Math.hypot(l.b.ce[0]-S.x,l.b.ce[1]-S.z)-l.b.rad;if(d<bd){bd=d;best=l.b;}}
    const el=$('near');if(best&&bd<15&&!S.over){el.hidden=false;el.innerHTML='지금 앞: <b></b>';el.querySelector('b').textContent=best.name;}else el.hidden=true;}
  if(HQ&&composer){composer.render();
    if(postCheck<60){postCheck++;
      if(postCheck>20&&!document.hidden){
        if(isBlank()){ if(++blankRun>=10){renderer.setRenderTarget(null);renderer.render(scene,cam);
            if(!isBlank()){console.warn('post-processing produced empty frames; turning it off');composer=null;aoBroken=true;$('hqBtn').textContent='고화질 켜짐(그림자 효과 제외)';}
            else{postCheck=60;}}}
        else{blankRun=0;postCheck=60;}}}}
  else renderer.render(scene,cam);
  drawMini();
}

/* ---------- boot ---------- */
(async()=>{
  status('OpenStreetMap에서 건물과 길 정보를 받는 중입니다…');
  const terrainP=getTerrain().catch(()=>false);
  let raw;
  try{raw=await getOSM();}catch(e){fail('지도 서버들이 지금 너무 바빠 건물 정보를 받지 못했습니다. 1~2분 뒤 다시 시도해 주세요.');return;}
  status('지형 높이를 받는 중입니다…');
  const hasTerrain=await terrainP;
  status('캠퍼스를 짓는 중입니다…');await new Promise(r=>setTimeout(r,30));
  const D=parse(raw);
  CAMPUS=D.campus.filter(c=>c.pts.length>2);
  if(CAMPUS.length){let best=CAMPUS[0],bd=1e18;for(const c of CAMPUS){const ce=centroid(c.pts);const d=pip(0,0,c.pts)?-1:ce[0]**2+ce[1]**2;if(d<bd){bd=d;best=c;}}campusCenter=centroid(best.pts);}
  paintLandcover(D);
  buildTerrain();
  buildBuildings(D);
  buildTrees(D);
  try{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]);}catch(e){}
  const named=placeLabels();fillPlaces(named);
  const nc=B.filter(b=>b.camp).length;
  $('sub').textContent=`캠퍼스 건물 ${nc}동 · 이름 있는 곳 ${named.length}곳${hasTerrain?' · 지형 높이 반영':''}`;
  if(nc<8){const n=$('note');n.hidden=false;n.innerHTML='이 캠퍼스는 OpenStreetMap에 건물이 적게 그려져 있어 일부만 보입니다. 누구나 <a href="https://www.openstreetmap.org" target="_blank" rel="noopener">openstreetmap.org</a>에서 건물을 더할 수 있어요.';}
  let fx=campusCenter[0],fz=campusCenter[1];
  if(Math.hypot(fx,fz)<20&&named.length){const nb=named.slice().sort((a,b)=>Math.hypot(a.ce[0],a.ce[1])-Math.hypot(b.ce[0],b.ce[1]))[0];fx=nb.ce[0];fz=nb.ce[1];}
  goTo(0,0,fx,fz);
  drawMiniStatic();
  await setupPost();
  setMode(true);
  $('load').hidden=true;
  loop();
})();
</script>
