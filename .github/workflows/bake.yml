# Prepares map data for every school ahead of time (see tools/bake.mjs).
# Works in batches: each run saves up to 40 schools, commits them, and starts the next run until none are missing.
name: Prepare campus map data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/**', '.github/workflows/bake.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: bake
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start from the newest copy of the site
        run: git fetch origin main && git reset --hard origin/main
      - id: bake
        run: node tools/bake.mjs 40
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Add prepared map data (${{ steps.bake.outputs.saved }} schools, ${{ steps.bake.outputs.left }} left)"
          # someone may have pushed meanwhile; data files never conflict in content, so keep ours
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
      - name: Continue with the next batch
        if: steps.bake.outputs.left != '0' && steps.bake.outputs.saved != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bake.yml --ref main
