<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>캠퍼스 지도</title>
<meta name="description" content="전국 4년제 대학 231곳을 실제 지형과 건물 3D 위에서 찾아보는 예비 대학생용 지도">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: 왼쪽은 브이월드 실사 3D 지도, 오른쪽은 색인(검색·목록·학교 카드). 휴대폰에서는 위아래로 쌓음. */
:root{
  --paper:#EBEFEA; --land:#F9FAF6; --land-hi:#E3EDE6; --ink:#1B252E; --muted:#5B686D; --line:#BFC9C5; --panel:#F6F8F4;
  --accent:#1E6B62; --accent-ink:#FFFFFF;
  --pin-pub:#2C4C9C; --pin-pri:#3F454B; --pin-edu:#A8721A; --pin-sci:#76399C;
  --shadow:0 1px 2px rgba(20,30,35,.08),0 6px 20px rgba(20,30,35,.08);
  --f-display:"Nanum Myeongjo","Noto Serif KR","Apple SD Gothic Neo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#11171B; --land:#1B242A; --land-hi:#21312E; --ink:#E5ECE9; --muted:#93A19E; --line:#2E3B40; --panel:#151C20;
  --accent:#55B6A8; --accent-ink:#0B1513;
  --pin-pub:#7E9BEA; --pin-pri:#B9C1C6; --pin-edu:#E0A846; --pin-sci:#C08BE6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr)}
header.top{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-block:calc(10px + env(safe-area-inset-top,0px)) 9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
header.top h1{font-family:var(--f-display);font-weight:800;font-size:1.4rem;margin:0}
header.top .sub{color:var(--muted);font-size:.85rem}
header.top .sub b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.mapwrap{position:relative;min-width:0;min-height:0;background:#cfdbe0;overflow:hidden}
#vmap{position:absolute;inset:0}
.mapbtns{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:5}
.mapbtns button{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 11px;font-size:.8rem;box-shadow:var(--shadow);cursor:pointer}
.mapbtns button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.legend{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));bottom:34px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:.74rem;display:grid;grid-template-columns:auto auto;gap:3px 12px;box-shadow:var(--shadow)}
.legend span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.ring3{background:transparent;border:2px solid var(--accent)}
aside.panel{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line)}
.controls{padding-block:12px 10px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:10px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--land);border-radius:10px;padding:0 10px}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:9px 0;font:inherit;color:var(--ink);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 11px;font-size:.8rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip.three[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scroll{overflow-y:auto;min-height:0;flex:1}
.count{font-size:.78rem;color:var(--muted);padding:8px 16px 4px;font-variant-numeric:tabular-nums}
ul.list{list-style:none;margin:0;padding:0 8px 16px}
ul.list li button{width:100%;text-align:left;border:0;background:transparent;padding:8px;border-radius:8px;display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:2px 10px;align-items:center;cursor:pointer}
ul.list li button:hover{background:var(--land)}
ul.list li button[aria-current="true"]{background:var(--land-hi)}
.lname{font-weight:600;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmeta{grid-column:2;font-size:.75rem;color:var(--muted)}
.badge{grid-row:1/3;grid-column:3;font-size:.68rem;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:0 5px}
.card{margin:12px 12px 4px;padding:16px;border:1px solid var(--line);background:var(--land);border-radius:12px;display:grid;gap:10px}
.card .kicker{font-size:.72rem;letter-spacing:.06em;color:var(--muted)}
.card h2{font-family:var(--f-display);font-weight:800;font-size:1.35rem;margin:0;line-height:1.25;text-wrap:balance}
.card dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:.84rem}
.card dt{color:var(--muted)}
.card dd{margin:0}
.card a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-size:.8rem;font-variant-numeric:tabular-nums}
.card .feat{font-size:.86rem;line-height:1.6;border-top:1px dashed var(--line);padding-top:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 12px;font-size:.84rem;cursor:pointer;text-decoration:none;color:var(--ink)!important;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)!important;font-weight:600}
.note{font-size:.75rem;color:var(--muted)}
.foot{padding:10px 16px 18px;font-size:.72rem;color:var(--muted);border-top:1px solid var(--line)}
.setup{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:var(--paper)}
.setup .box{max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);display:grid;gap:10px;font-size:.9rem}
.setup h2{font-family:var(--f-display);font-weight:800;font-size:1.2rem;margin:0}
.setup ol{margin:0;padding-left:1.2em;display:grid;gap:4px}
.setup code{font-family:var(--f-mono);font-size:.8rem;background:var(--land);border:1px solid var(--line);border-radius:5px;padding:0 4px;word-break:break-all}
@media (max-width:820px){
  body{overflow:auto}
  .app{height:auto;min-height:100%;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 62vh auto}
  aside.panel{border-left:0;border-top:1px solid var(--line)}
  .scroll{overflow:visible}
  .legend{font-size:.68rem;bottom:30px}
}
</style>

      </div>
    </div>
  </aside>
</div>

 '제주대학교|':{blurb:'아라캠퍼스 진입로는 제주 왕벚나무 길로 이름난 봄 명소입니다. 맑은 날에는 벚꽃과 잔디 너머로 한라산 능선이 함께 보입니다.', src:'제주 관광 기사(네이트 여행)'},
 '한국에너지공과대학교|':{blurb:'나주 빛가람혁신도시에 2022년 문을 연 에너지 특화 대학입니다. 소수 정예 기숙형 대학을 표방하며, 다목적 광장을 중심으로 캠퍼스를 단계적으로 짓고 있습니다.', src:'서울신문(2021), 뉴시스(2023), 세계일보(2026)'}
};
UNIS.forEach(u=>{ const f=FEAT[u.name+'|'+u.b]; if(f) u.f=f; });

/* ---------- list & filters ---------- */
const REGIONS=['전체','서울','경기·인천','강원','충청','전라','경상','제주'];
const TYPES=[['all','모든 유형'],['pub','국공립'],['pri','사립'],['edu','교육대'],['sci','과학기술원·특화'],['f','상징물 해설']];
let fRegion='전체',fType='all',q='',selected=null,filtered=[];
const regEl=document.getElementById('regions'),typEl=document.getElementById('types');
REGIONS.forEach(r=>{const b=document.createElement('button');b.className='chip';b.textContent=r;b.setAttribute('aria-pressed',r===fRegion);b.onclick=()=>{fRegion=r;[...regEl.children].forEach(c=>c.setAttribute('aria-pressed',c===b));update(true);};regEl.appendChild(b);});
TYPES.forEach(([k,l])=>{const b=document.createElement('button');b.className='chip'+(k==='f'?' three':'');b.textContent=l;b.setAttribute('aria-pressed',k===fType);b.onclick=()=>{fType=k;[...typEl.children].forEach(c=>c.setAttribute('aria-pressed',c===b));update(false);};typEl.appendChild(b);});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim();update(false);});
function matches(u){
  if(fRegion!=='전체'&&REGION_GROUP[u.r]!==fRegion)return false;
  if(fType==='f'){if(!u.f)return false;}else if(fType!=='all'&&u.g!==fType)return false;
  if(q){const hay=[u.name,u.r,u.city,CAMPUS[u.b],EST[u.e],TYPE[u.t],PROV_OF[u.r]].join(' ').replace(/\s/g,'');const q1=q.replace(/\s/g,''),q2=q1.replace(/대$/,'대학교');if(!hay.includes(q1)&&!hay.includes(q2))return false;}
  return true;
}
const listEl=document.getElementById('list'),countEl=document.getElementById('count');
function update(flyRegion){
  const qn=q.replace(/\s/g,'');const nm=u=>qn&&u.name.replace(/\s/g,'').includes(qn)?1:0;
  filtered=UNIS.filter(matches).sort((a,b)=>(nm(b)-nm(a))||(!!b.f-!!a.f)||a.name.localeCompare(b.name,'ko')||a.b.localeCompare(b.b));
  const set=new Set(filtered.map(u=>u.i));
  MAP.setVisible(set);
  countEl.textContent=`${filtered.length}곳`+(fRegion!=='전체'?` · ${fRegion}`:'')+(q?` · “${q}” 검색`:'');
  listEl.textContent='';
  filtered.forEach(u=>{const li=document.createElement('li');const b=document.createElement('button');
    b.innerHTML=`<i class="dot" style="background:var(--pin-${u.g})"></i><span class="lname"></span>${u.f?'<span class="badge">해설</span>':''}<span class="lmeta"></span>`;
    b.querySelector('.lname').textContent=u.name+(u.b?' · '+CAMPUS[u.b]:'');
    b.querySelector('.lmeta').textContent=`${u.r} ${u.city} · ${EST[u.e]}${u.t!=='U'?' '+TYPE[u.t]:''}`;
    if(u.i===selected)b.setAttribute('aria-current','true');
    b.onclick=()=>select(u.i,false);li.appendChild(b);listEl.appendChild(li);});
  if(flyRegion){ if(fRegion==='전체') MAP.home(); else if(filtered.length) MAP.fitTo(filtered); }
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function select(i,fromMap){
  selected=i;const u=UNIS[i];
  const siblings=UNIS.filter(v=>v.base===u.base&&v.i!==u.i);
  const kakao=`https://map.kakao.com/link/map/${encodeURIComponent(u.name)},${u.lat},${u.lon}`;
  const naver=`https://map.naver.com/p/search/${encodeURIComponent(u.name+(u.b&&!/\(/.test(u.name)?' '+CAMPUS[u.b]:''))}`;
  const slot=document.getElementById('cardslot');
  slot.innerHTML=`<article class="card" aria-live="polite">
    <div class="kicker">${esc(PROV_OF[u.r]||u.r)} ${esc(u.city)}</div>
    <h2>${esc(u.name)}</h2>
    <dl>
      <dt>캠퍼스</dt><dd>${esc(CAMPUS[u.b])}</dd>
      <dt>설립</dt><dd>${esc(EST[u.e])}</dd>
      <dt>학제</dt><dd>${esc(TYPE[u.t])}</dd>
      <dt>좌표</dt><dd class="mono">${u.lat.toFixed(3)}°N ${u.lon.toFixed(3)}°E</dd>
      ${siblings.length?`<dt>다른 캠퍼스</dt><dd>${siblings.map(s=>`<a href="#" data-go="${s.i}" class="sib">${esc(s.city)} ${esc(CAMPUS[s.b])}</a>`).join(' · ')}</dd>`:''}
    </dl>
    ${u.f?`<div class="feat">${esc(u.f.blurb)}<div class="note" style="margin-top:6px">출처: ${esc(u.f.src)}</div></div>`:''}
    <div class="actions">
      <button class="btn primary" id="goFly">캠퍼스로 날아가기</button>
      <a class="btn" href="${kakao}" target="_blank" rel="noopener">카카오맵</a>
      <a class="btn" href="${naver}" target="_blank" rel="noopener">네이버 지도</a>
    </div>
  </article>`;
  slot.querySelectorAll('.sib').forEach(a=>a.onclick=e=>{e.preventDefault();select(+a.dataset.go,false);});
  slot.querySelector('#goFly').onclick=()=>MAP.flyToUni(u);
  MAP.highlight(u);
  if(!fromMap) MAP.flyToUni(u);
  update(false);
  if(window.innerWidth<=820){ if(!fromMap) window.scrollTo({top:0,behavior:'smooth'}); else slot.scrollIntoView({behavior:'smooth',block:'start'}); }
  else document.getElementById('scroll').scrollTop=0;
}

/* ---------- 3D map (V-World WebGL 3.0, Cesium-based) ---------- */
const MAP = (()=>{
  let viewer=null, ents=[], selEnt=null, orbitOn=false, orbitCenter=null, orbitRemove=null, pending=[];
  const api={ready:false};
  const run=f=>api.ready?f():pending.push(f);
  function C(){return window.Cesium;}
  function addEntities(){
    const Ce=C();
    ents=UNIS.map(u=>{
      const col=Ce.Color.fromCssColorString(COLORS[u.g]);
      return viewer.entities.add({
        id:'uni-'+u.i,
        position:Ce.Cartesian3.fromDegrees(u.lon,u.lat),
        point:{pixelSize:u.f?13:10,color:col,outlineColor:u.f?Ce.Color.fromCssColorString('#1E6B62'):Ce.Color.WHITE,outlineWidth:u.f?4:2,
          heightReference:Ce.HeightReference.CLAMP_TO_GROUND,disableDepthTestDistance:Number.POSITIVE_INFINITY},
        label:{text:u.name.replace('대학교','대')+(u.b?' '+CAMPUS[u.b]:''),font:'600 14px "IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif',
          fillColor:Ce.Color.fromCssColorString('#1B252E'),outlineColor:Ce.Color.WHITE,outlineWidth:4,style:Ce.LabelStyle.FILL_AND_OUTLINE,
          verticalOrigin:Ce.VerticalOrigin.BOTTOM,pixelOffset:new Ce.Cartesian2(0,-12),heightReference:Ce.HeightReference.CLAMP_TO_GROUND,
          distanceDisplayCondition:new Ce.DistanceDisplayCondition(0,u.f?120000:45000),disableDepthTestDistance:Number.POSITIVE_INFINITY}
      });
    });
    const h=new Ce.ScreenSpaceEventHandler(viewer.scene.canvas);
    h.setInputAction(m=>{const p=viewer.scene.pick(m.position);if(p&&p.id&&typeof p.id.id==='string'&&p.id.id.startsWith('uni-')){select(+p.id.id.slice(4),true);}},Ce.ScreenSpaceEventType.LEFT_CLICK);
    h.setInputAction(()=>stopOrbit(),Ce.ScreenSpaceEventType.LEFT_DOWN);
  }
  function stopOrbit(){
    if(!orbitOn)return;orbitOn=false;document.getElementById('bOrbit').setAttribute('aria-pressed','false');
    if(orbitRemove){orbitRemove();orbitRemove=null;}
    viewer.camera.lookAtTransform(C().Matrix4.IDENTITY);
  }
  api.init=function(){
    const Ce=C();viewer=window.ws3d&&window.ws3d.viewer;
    if(!viewer||!Ce){return false;}
    api.ready=true;addEntities();
    document.getElementById('bOrbit').disabled=false;document.getElementById('bTop').disabled=false;
    pending.splice(0).forEach(f=>f());
    return true;
  };
  api.setVisible=set=>run(()=>ents.forEach((e,i)=>e.show=set.has(i)));
  api.highlight=u=>run(()=>{const Ce=C();if(selEnt){selEnt.point.pixelSize=selEnt._ps;selEnt.label.distanceDisplayCondition=selEnt._dd;}selEnt=ents[u.i];selEnt._ps=selEnt.point.pixelSize;selEnt._dd=selEnt.label.distanceDisplayCondition;selEnt.point.pixelSize=18;selEnt.label.distanceDisplayCondition=new Ce.DistanceDisplayCondition(0,1e7);orbitCenter=u;});
  api.flyToUni=u=>run(()=>{stopOrbit();const Ce=C();orbitCenter=u;
    // oblique view from the south: 650m up, 35° down, about 930m back
    viewer.camera.flyTo({destination:Ce.Cartesian3.fromDegrees(u.lon,u.lat-0.0084,650),orientation:{heading:0,pitch:Ce.Math.toRadians(-35),roll:0},duration:2.4});});
  api.home=()=>run(()=>{stopOrbit();const Ce=C();viewer.camera.flyTo({destination:Ce.Cartesian3.fromDegrees(127.9,31.9,430000),orientation:{heading:0,pitch:Ce.Math.toRadians(-42),roll:0},duration:2.2});});
  api.fitTo=list=>run(()=>{stopOrbit();const Ce=C();const lons=list.map(u=>u.lon),lats=list.map(u=>u.lat);
    // tilted view of the region: camera south of the group, looking north at 45°
    const cLon=(Math.min(...lons)+Math.max(...lons))/2,cLat=(Math.min(...lats)+Math.max(...lats))/2;
    const spanKm=Math.max(25,(Math.max(...lats)-Math.min(...lats))*111,(Math.max(...lons)-Math.min(...lons))*90);
    const h=spanKm*1000*1.1, back=h/111000;
    viewer.camera.flyTo({destination:Ce.Cartesian3.fromDegrees(cLon,cLat-back,h),orientation:{heading:0,pitch:Ce.Math.toRadians(-45),roll:0},duration:2.2});});
  api.top=()=>run(()=>{stopOrbit();const Ce=C();const u=orbitCenter;if(!u)return;viewer.camera.flyTo({destination:Ce.Cartesian3.fromDegrees(u.lon,u.lat,1400),orientation:{heading:0,pitch:Ce.Math.toRadians(-90),roll:0},duration:1.6});});
  api.orbit=()=>run(()=>{const Ce=C();const u=orbitCenter;if(!u)return;if(orbitOn){stopOrbit();return;}
    orbitOn=true;document.getElementById('bOrbit').setAttribute('aria-pressed','true');
    const center=Ce.Cartesian3.fromDegrees(u.lon,u.lat,40);let heading=viewer.camera.heading;
    viewer.camera.lookAt(center,new Ce.HeadingPitchRange(heading,Ce.Math.toRadians(-30),1100));
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    orbitRemove=viewer.clock.onTick.addEventListener(()=>{heading+=reduce?0.0008:0.0022;viewer.camera.lookAt(center,new Ce.HeadingPitchRange(heading,Ce.Math.toRadians(-30),1100));});
  });
  return api;
})();
document.getElementById('bAll').onclick=()=>MAP.home();
document.getElementById('bOrbit').onclick=()=>{if(!MAP.ready){return;}if(selected==null){showToastPick();return;}MAP.orbit();};
document.getElementById('bTop').onclick=()=>{if(selected==null){showToastPick();return;}MAP.top();};
function showToastPick(){countEl.textContent='먼저 목록이나 지도에서 학교를 고르세요.';setTimeout(()=>update(false),2200);}

function showSetup(kind){
  const s=document.getElementById('setup');s.hidden=false;
  const host=location.origin&&location.origin!=='null'?location.origin:'(이 사이트 주소)';
  if(kind==='nokey'){
    document.getElementById('setupTitle').textContent='브이월드 인증키를 넣어 주세요';
    document.getElementById('setupBody').innerHTML=`<p>실제 지형과 건물 3D는 국토교통부 브이월드 지도를 씁니다. 무료 인증키 하나만 있으면 됩니다.</p>
    <ol><li>vworld.kr 에 가입하고 <b>오픈API → 인증키 발급</b>을 엽니다.</li>
    <li>서비스 URL에 이 사이트 주소 <code>${esc(host)}</code> 를 적고, 활용할 API 목록에서 <b>3D 지도(WebGL)</b> 항목을 고릅니다.</li>
    <li>받은 키를 <code>config.js</code> 파일의 따옴표 안에 붙여 넣고 다시 올립니다.</li></ol>
    <p class="note">키가 없어도 오른쪽 목록과 검색, 학교 카드는 그대로 쓸 수 있습니다.</p>`;
  } else {
    document.getElementById('setupTitle').textContent='3D 지도를 불러오지 못했습니다';
    document.getElementById('setupBody').innerHTML=`<p>인증키는 들어 있지만 브이월드가 응답하지 않았습니다. 가장 흔한 원인은 키를 발급할 때 적은 서비스 URL이 지금 주소 <code>${esc(host)}</code> 와 다른 경우입니다.</p>
    <ol><li>vworld.kr <b>마이페이지 → 인증키 관리</b>에서 서비스 URL을 확인하고 지금 주소로 고칩니다.</li>
    <li>인터넷 연결과 브라우저의 광고 차단 기능을 확인합니다.</li>
    <li>고친 뒤 새로고침합니다.</li></ol>`;
  }
}

document.getElementById('total').textContent=UNIS.length;
update(false);
(function boot(){
  if(!window.KEY_OK){showSetup('nokey');return;}
  if(typeof window.vw==='undefined'){showSetup('fail');return;}
  try{
    const map=new vw.Map();
    map.setOption({mapId:'vmap',initPosition:new vw.CameraPosition(new vw.CoordZ(127.9,31.9,430000),new vw.Direction(0,-42,0)),logo:true,navigation:true});
    map.start();
  }catch(e){console.error(e);showSetup('fail');return;}
  let tries=0;
  const tryInit=()=>{ if(MAP.ready)return; if(MAP.init())return; if(++tries>150){showSetup('fail');return;} setTimeout(tryInit,200); };
  vw.ws3dInitCallBack=tryInit;
  tryInit();
})();
</script>
